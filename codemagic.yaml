workflows:
  android-apk:
    name: ARMANVPN Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
